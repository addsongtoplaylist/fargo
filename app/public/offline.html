<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Fargo — Offline</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600&display=swap');
    * { margin: 0; box-sizing: border-box; }
    body {
      font-family: 'Sora', system-ui, sans-serif;
      background: #f7f2ee;
      color: #1c1917;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .icon {
      width: 64px;
      height: 64px;
      background: #1a8a6e;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    .icon span {
      color: #f7f2ee;
      font-size: 28px;
      font-weight: 600;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.875rem;
      color: #78716c;
      line-height: 1.5;
      max-width: 280px;
    }
    button {
      margin-top: 1.5rem;
      padding: 0.625rem 1.5rem;
      background: #1a8a6e;
      color: #f7f2ee;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="icon"><span>F</span></div>
  <h1>You're offline</h1>
  <p>Check your internet connection and try again.</p>
  <button onclick="location.reload()">Retry</button>
</body>
</html>
